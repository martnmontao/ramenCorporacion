<ion-content>
  <div id = "contenedor-principal">
    <header>
       <h1 class ="titulos">RamenGB🍜</h1>
       <button id = "btn-mostrar-opciones" (click) = "mostrarContenedores('opciones')">≋</button>
       <div id = "contenedor-opciones-inicio" class="contenedor-animado"[class.visible]="mostrarOpciones">
         <button (click)="irA('lista-usuarios')"class="btn-opciones-inicio" *ngIf = "user && user.perfil == 'gerencia'">ADMINISTRACIÓN</button>
         <button (click)="cerrarSesion()"class="btn-opciones-inicio">CERRAR SESIÓN</button>
       </div>
     </header>


  <form [formGroup]="mesaForm" (ngSubmit)="onSubmit()">

  <!-- Número de Mesa -->
  <div class="form-group">
    <label for="numeroMesa" class="form-label">Número de Mesa</label>
    <input
      id="numeroMesa"
      type="text"
      formControlName="numeroMesa"
      placeholder="Ej: A1, Mesa VIP 5"
      class="custom-input"
    />
    <div *ngIf="formControls['numeroMesa'].invalid && formControls['numeroMesa'].touched" class="error-message">
      <p *ngIf="formControls['numeroMesa'].errors?.['required']">El número de mesa es requerido.</p>
      <p *ngIf="formControls['numeroMesa'].errors?.['pattern']">Solo se permiten letras y números.</p>
    </div>
  </div>

  <!-- Capacidad -->
  <div class="form-group">
    <label for="capacidad" class="form-label">Capacidad (personas)</label>
    <input
      id="capacidad"
      type="number"
      formControlName="capacidad"
      placeholder="Ej: 4"
      class="custom-input"
    />
    <div *ngIf="formControls['capacidad'].invalid && formControls['capacidad'].touched" class="error-message">
      <p *ngIf="formControls['capacidad'].errors?.['required']">La capacidad es requerida.</p>
      <p *ngIf="formControls['capacidad'].errors?.['min']">La capacidad mínima es 1.</p>
      <p *ngIf="formControls['capacidad'].errors?.['max']">La capacidad máxima es 7.</p>
    </div>
  </div>

  <!-- Tipo de Mesa -->
  <div class="form-group">
    <label for="tipo" class="form-label">Tipo de Mesa</label>
    <select id="tipo" formControlName="tipo" class="custom-select">
      <option value="" disabled selected>Selecciona un tipo</option>
      <option *ngFor="let tipo of tiposMesa" [value]="tipo">{{ tipo | titlecase }}</option>
    </select>
    <div *ngIf="formControls['tipo'].invalid && formControls['tipo'].touched" class="error-message">
      <p *ngIf="formControls['tipo'].errors?.['required']">El tipo de mesa es requerido.</p>
    </div>
  </div>

  <!-- Botón -->
  <div class="form-group">
    <button type="submit" [disabled]="mesaForm.invalid" class="submit-button">
      Agregar Mesa
    </button>
  </div>

</form>

</div>
</ion-content>
