<ion-content [fullscreen]="true" *ngIf = "!qrService.scan">
  <div id = "contenedor-principal" *ngIf = "!qrService.scan">
    <header>
      <h1 class ="titulos">RamenGB🍜</h1>
      <button id = "btn-mostrar-opciones" (click) = "mostrarContenedores('opciones')">≋</button>
      <div id = "contenedor-opciones-inicio" class="contenedor-animado"[class.visible]="mostrarOpciones">
        <button (click)="cerrarSesion()"class="btn-opciones-inicio">CERRAR SESIÓN</button>
      </div>
    </header>
    
      <div *ngIf="isLoading" class="spinner-container">
        <div class="spinner"></div>
      </div>
    <section *ngIf = "!isLoading">
    
        <div id = "contenedor-opciones-cliente">
          <!--
            <button class = "btn-opciones-cliente" (click)="irA('alta-mesa')">dar de alta mesa</button>
            <button class = "btn-opciones-cliente" (click)="irConQR()">ESCANEAR QR</button>
          -->
          <h2 *ngIf = "verificarCliente">Número de mesa asignada: {{numeroMesa}}</h2>
          <button class = "btn-opciones-cliente" (click)="irA('solicitar-mesa')" *ngIf = "!verificarCliente">Ingresar a la lista de espera</button>


          <button class = "btn-opciones-cliente" (click)="accederEncuesta()">Realizar ENCUESTA</button>
          <button class = "btn-opciones-cliente" (click)="verEstadisticasCliente()">Ver ESTADISTICAS DE ENCUESTAS</button>

          <button class = "btn-opciones-cliente" (click)="irA('productos')" *ngIf = "verificarQr">MENÚ</button><!--POR QR-->
          <button class = "btn-opciones-cliente" (click)="irA('productos')">MENÚ</button><!--POR QR-->
          <button class = "btn-opciones-cliente" (click)="irA('lista-pedidos')">VER PEDIDO</button><!--POR QR-->


          <button class = "btn-opciones-cliente" *ngIf = "verificarCliente" (click) = "irA('chat-mozo')">Consulta al mozo</button>
          <button class = "btn-opciones-cliente" *ngIf = "verificarCliente" (click)="scanearCodigoMesa()" >ESCANEAR CÓDIGO DE MESA</button>
          <button class = "btn-opciones-cliente" *ngIf = "verificarQr && pedidoTomado" (click) = "irA('juegos-vista')">JUEGOS</button>
          <button class = "btn-opciones-cliente" (click)="irA('lista-pedidos')" *ngIf = "verificarQr && verificarPedido">VER PEDIDO</button><!--POR QR-->
          
          <button class = "btn-opciones-cliente" (click)="irA('lista-pedidos')" *ngIf = "verificarQr && pedidoTerminado">PEDIR CUENTA</button><!--POR QR-->

        

        </div>
    </section>
  </div>
</ion-content>
